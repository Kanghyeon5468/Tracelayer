[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelayer-api"
version = "0.1.0"
description = "Fraud investigation agent fleet for the Fortified Enterprise Fleet track."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk>=1.29.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]
gemini = [
    "google-genai>=1.0.0",
]
cloud = [
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-firestore>=2.17.0",
    "google-cloud-modelarmor>=0.7.1",
    "google-cloud-pubsub>=2.23.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
