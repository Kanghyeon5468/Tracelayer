<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TraceLayer Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell admin-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Supervisor Console</p>
          <h1>TraceLayer Admin</h1>
          <p id="admin-runtime-status" class="runtime-status">Backend: checking</p>
        </div>
        <nav class="header-actions" aria-label="Admin actions">
          <a class="button-link secondary" href="./index.html">Dashboard</a>
          <button id="refresh-approvals" type="button">Refresh</button>
        </nav>
      </header>

      <section class="admin-controls" aria-label="Admin connection settings">
        <label>
          API Base URL
          <input id="api-base-url" type="url" autocomplete="off" />
        </label>
        <label>
          API Key
          <input id="api-key" type="password" autocomplete="off" />
        </label>
        <label>
          Supervisor
          <input id="supervisor-id" type="email" autocomplete="off" />
        </label>
        <button id="save-settings" type="button">Save</button>
      </section>

      <section class="case-strip admin-strip" aria-label="Approval queue summary">
        <div>
          <span>Pending</span>
          <strong id="pending-count">0</strong>
        </div>
        <div>
          <span>Highest Risk</span>
          <strong id="highest-risk">-</strong>
        </div>
        <div>
          <span>Last Action</span>
          <strong id="last-action">None</strong>
        </div>
      </section>

      <section class="admin-layout">
        <article class="panel">
          <h2>Pending Human Approvals</h2>
          <div id="approval-queue" class="approval-queue"></div>
        </article>

        <article class="panel">
          <h2>Selected Case</h2>
          <div id="selected-case" class="selected-case"></div>
        </article>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
