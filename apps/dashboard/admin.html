<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TraceLayer Admin</title>
    <link rel="stylesheet" href="./styles.css?v=20260813-risk-policy-feedback" />
  </head>
  <body>
    <main class="shell admin-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Supervisor Console</p>
          <h1>TraceLayer Admin</h1>
          <p id="admin-runtime-status" class="runtime-status">Backend: checking</p>
        </div>
        <nav class="header-actions" aria-label="Admin actions">
          <a class="button-link secondary" href="./index.html">Dashboard</a>
          <button id="refresh-approvals" type="button">Refresh</button>
        </nav>
      </header>

      <section class="admin-controls" aria-label="Admin connection settings">
        <label>
          API Base URL
          <input id="api-base-url" type="url" autocomplete="off" />
        </label>
        <label>
          API Key
          <input id="api-key" type="password" autocomplete="off" />
        </label>
        <label>
          Supervisor
          <input id="supervisor-id" type="email" autocomplete="off" />
        </label>
        <button id="save-settings" type="button">Save</button>
      </section>

      <section class="case-strip admin-strip" aria-label="Approval queue summary">
        <div>
          <span>Pending</span>
          <strong id="pending-count">0</strong>
        </div>
        <div>
          <span>Highest Risk</span>
          <strong id="highest-risk">-</strong>
        </div>
        <div>
          <span>Last Action</span>
          <strong id="last-action">None</strong>
        </div>
      </section>

      <section class="panel risk-policy-panel" aria-label="Risk threshold policy">
        <header>
          <div>
            <h2>Risk Thresholds</h2>
            <p id="risk-policy-status" class="runtime-status">Policy: loading</p>
          </div>
          <button id="save-risk-policy" type="button">Save Thresholds</button>
        </header>
        <div class="risk-policy-grid">
          <label>
            Medium
            <input id="medium-threshold" type="number" min="0" max="100" step="1" />
          </label>
          <label>
            High
            <input id="high-threshold" type="number" min="0" max="100" step="1" />
          </label>
          <label>
            Critical
            <input id="critical-threshold" type="number" min="0" max="100" step="1" />
          </label>
        </div>
        <p id="risk-policy-feedback" class="risk-policy-feedback" role="status"></p>
      </section>

      <section class="admin-layout">
        <article class="panel">
          <h2>Pending Human Approvals</h2>
          <div id="approval-queue" class="approval-queue"></div>
        </article>

        <article class="panel">
          <h2>Selected Case</h2>
          <div id="selected-case" class="selected-case"></div>
        </article>

        <article class="panel admin-history-panel">
          <h2>Approval Log</h2>
          <div id="approval-log" class="approval-log"></div>
        </article>
      </section>
    </main>
    <script src="./config.js?v=20260813-risk-policy-feedback"></script>
    <script src="./admin.js?v=20260813-risk-policy-feedback"></script>
  </body>
</html>
