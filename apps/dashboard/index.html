<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TraceLayer Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fortified Enterprise Fleet</p>
          <h1>TraceLayer</h1>
          <p id="runtime-status" class="runtime-status">Backend: local fallback</p>
        </div>
        <nav class="header-actions" aria-label="Dashboard actions">
          <a class="button-link secondary" href="./admin.html">Admin</a>
          <button id="run-demo" type="button">Run Demo Case</button>
        </nav>
      </header>

      <section class="case-strip" aria-label="Case summary">
        <div>
          <span>Case</span>
          <strong id="case-id">case-tx-9001</strong>
        </div>
        <div>
          <span>Status</span>
          <strong id="case-status">Needs approval</strong>
        </div>
        <div>
          <span>Risk</span>
          <strong id="risk-score">90</strong>
        </div>
        <div>
          <span>Priority</span>
          <strong id="priority">Critical</strong>
        </div>
        <div>
          <span>Audit</span>
          <strong id="audit-tip">Verified</strong>
        </div>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Agent Findings</h2>
          <div id="agent-findings" class="stack"></div>
        </article>

        <article class="panel">
          <h2>Network Links</h2>
          <div id="network-links" class="stack"></div>
        </article>

        <article class="panel wide">
          <h2>Embedded Veritas Federation</h2>
          <div id="federated-signal" class="federated"></div>
        </article>

        <article class="panel wide">
          <h2>Evidence Timeline</h2>
          <div id="timeline" class="timeline"></div>
        </article>

        <article class="panel">
          <h2>Compliance</h2>
          <div id="compliance" class="stack"></div>
        </article>

        <article class="panel">
          <h2>Guardrails</h2>
          <div id="guardrails" class="stack"></div>
        </article>

        <article class="panel">
          <h2>Human Approval</h2>
          <div id="approval" class="approval"></div>
        </article>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
