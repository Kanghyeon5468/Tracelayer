apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tracelayer-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: tracelayer-agent@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/tracelayer/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: cloud
            - name: USE_MOCK_DATA
              value: "false"
            - name: SECURITY_MODE
              value: enforcing
            - name: AI_PROVIDER
              value: vertex_ai
            - name: GEMINI_MODEL
              value: gemini-3.5-flash
            - name: ADK_MODEL
              value: gemini-3.5-flash
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: us
            - name: AGENT_REGISTRY_LOCATION
              value: us-central1
            - name: GOOGLE_API_USE_MTLS_ENDPOINT
              value: never
            - name: GOOGLE_API_USE_CLIENT_CERTIFICATE
              value: "false"
            - name: PUBLIC_SERVICE_URL
              value: https://tracelayer-api-235426782310.us-central1.run.app
            - name: TRIAGE_AGENT_ENGINE_RESOURCE
              value: ""
            - name: TRIAGE_AGENT_RUNTIME_PRINCIPAL
              value: ""
            - name: MODEL_ARMOR_BACKEND
              value: google
            - name: MODEL_ARMOR_LOCATION
              value: us-central1
            - name: MODEL_ARMOR_TEMPLATE_ID
              value: tracelayer-prompt-shield
            - name: MEMORY_BACKEND
              value: firestore
            - name: FIRESTORE_DATABASE
              value: (default)
            - name: FIRESTORE_CASE_COLLECTION
              value: tracelayer_cases
            - name: ALLOWED_ORIGINS
              value: https://YOUR_DASHBOARD_DOMAIN
            - name: PUBSUB_TOPIC_INVESTIGATIONS
              value: tracelayer-investigations
            - name: PUBSUB_TOPIC_APPROVALS
              value: tracelayer-approvals
            - name: AUDIT_LEDGER_PATH
              value: /tmp/tracelayer-audit-ledger.jsonl
